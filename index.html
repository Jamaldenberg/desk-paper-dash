<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Desk Paper Dashboard</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg2: #121a2b;
      --card: #162033;
      --card-hover: #1c2940;
      --border: #2a3a55;
      --text: #e8eef8;
      --muted: #9aa8c0;
      --accent: #5b9fd4;
      --paper: #e8a317;
      --pos: #3ecf8e;
      --neg: #f07178;
      --warn: #e8a317;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
      min-height: 100%;
    }
    a { color: var(--accent); text-decoration: none; }
    .banner {
      position: sticky; top: 0; z-index: 50;
      background: linear-gradient(90deg, #5a3a00, #8a5a00);
      color: #fff8e6;
      text-align: center;
      font-weight: 700;
      letter-spacing: .04em;
      font-size: .85rem;
      padding: .55rem .75rem;
      border-bottom: 1px solid #c4891a;
    }
    header.app {
      padding: 1rem 1rem .5rem;
      max-width: 920px;
      margin: 0 auto;
    }
    header.app h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 750;
    }
    header.app .sub {
      color: var(--muted);
      font-size: .85rem;
      margin-top: .25rem;
    }
    .meta-bar {
      display: flex; flex-wrap: wrap; gap: .5rem .75rem;
      align-items: center;
      margin-top: .75rem;
      font-size: .8rem;
      color: var(--muted);
    }
    .pill {
      display: inline-flex; align-items: center; gap: .35rem;
      border: 1px solid var(--border);
      background: var(--bg2);
      border-radius: 999px;
      padding: .2rem .65rem;
      font-size: .75rem;
    }
    .pill.live { border-color: #2f6b4f; color: var(--pos); }
    .pill.mode { text-transform: lowercase; }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 1rem calc(2rem + var(--safe-b));
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: .85rem;
      margin-top: 1rem;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .grid .span2 { grid-column: 1 / -1; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: background .15s, transform .12s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover, .card:focus-visible {
      background: var(--card-hover);
      border-color: var(--accent);
      outline: none;
    }
    .card:active { transform: scale(.99); }
    .card h2 {
      margin: 0 0 .35rem;
      font-size: 1.05rem;
    }
    .card .headline {
      color: var(--muted);
      font-size: .82rem;
      margin: .35rem 0 .6rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .stats {
      display: flex; flex-wrap: wrap; gap: .5rem;
      margin-top: .4rem;
    }
    .stat {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .4rem .55rem;
      min-width: 5.2rem;
    }
    .stat .k { display:block; color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .03em; }
    .stat .v { display:block; font-weight: 650; font-variant-numeric: tabular-nums; font-size: .92rem; }
    .pos { color: var(--pos); }
    .neg { color: var(--neg); }
    .back {
      display: inline-flex; align-items: center; gap: .4rem;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      border-radius: 999px;
      padding: .45rem .9rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      margin: .5rem 0 1rem;
    }
    .back:hover { border-color: var(--accent); }
    .detail-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: .85rem;
      box-shadow: var(--shadow);
    }
    .detail-section h3 {
      margin: 0 0 .65rem;
      font-size: .95rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      text-align: left;
      padding: .45rem .35rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; }
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    ul.learn { margin: 0; padding-left: 1.1rem; color: var(--text); }
    ul.learn li { margin-bottom: .35rem; font-size: .88rem; }
    .err {
      background: #3a1a1f;
      border: 1px solid #7a3038;
      color: #ffc9cd;
      padding: .85rem 1rem;
      border-radius: var(--radius);
      margin-top: 1rem;
    }
    .empty { color: var(--muted); font-size: .9rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .78rem; }
    pre.raw {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .75rem;
      overflow: auto;
      max-height: 280px;
      font-size: .72rem;
      color: var(--muted);
    }
    footer {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
      color: var(--muted);
      font-size: .75rem;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1rem;
      box-shadow: var(--shadow);
    }
    .hero .equity-big {
      font-size: 1.75rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      margin: .15rem 0;
    }
    .hero .equity-sub { color: var(--muted); font-size: .85rem; }
    .chart-wrap {
      margin-top: .75rem;
      width: 100%;
      touch-action: pan-y;
      -webkit-user-select: none;
      user-select: none;
    }
    .chart-wrap svg { display: block; width: 100%; height: auto; }
    .chart-meta {
      display: flex; flex-wrap: wrap; gap: .5rem .75rem;
      justify-content: space-between;
      align-items: baseline;
      margin-top: .35rem;
      font-size: .75rem;
      color: var(--muted);
    }
    .chart-empty {
      color: var(--muted);
      font-size: .88rem;
      padding: .75rem 0 .25rem;
      border-top: 1px dashed var(--border);
      margin-top: .75rem;
    }
    .chart-tip {
      position: absolute;
      pointer-events: none;
      background: #0e1626;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: .72rem;
      padding: .3rem .45rem;
      border-radius: 8px;
      white-space: nowrap;
      z-index: 5;
      transform: translate(-50%, -120%);
      box-shadow: var(--shadow);
    }

    .strat-block {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .85rem;
      margin-top: .75rem;
    }
    .strat-block h4 {
      margin: 0 0 .5rem;
      font-size: 1rem;
      font-weight: 700;
    }
    .strat-pills {
      display: flex; flex-wrap: wrap; gap: .35rem;
      margin-bottom: .55rem;
    }
    .strat-note {
      color: var(--muted);
      font-size: .72rem;
      margin: .35rem 0 .15rem;
    }
    .strat-sub { font-size: .82rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 .4rem; }
    .topnav {
      display: flex; flex-wrap: wrap; gap: .45rem;
      margin-top: .75rem;
    }
    .topnav a {
      display: inline-flex; align-items: center;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      border-radius: 999px;
      padding: .4rem .85rem;
      font-size: .85rem;
      font-weight: 650;
    }
    .topnav a.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #1a2a42;
    }
    .tables-cta {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: .5rem;
      margin-top: .85rem;
      padding: .75rem .85rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-weight: 650;
    }
    .tables-cta:hover { border-color: var(--accent); color: var(--accent); }
    .tables-toolbar {
      display: flex; flex-wrap: wrap; gap: .45rem;
      margin: .35rem 0 .15rem;
    }
    .tables-toolbar button {
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      border-radius: 999px;
      padding: .35rem .75rem;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tables-toolbar button:hover { border-color: var(--accent); }
    details.strat-block { padding: 0; }
    details.strat-block > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .4rem .55rem;
      padding: .85rem;
      -webkit-tap-highlight-color: transparent;
    }
    details.strat-block > summary::-webkit-details-marker { display: none; }
    details.strat-block > summary::before {
      content: '▸';
      color: var(--muted);
      font-size: .85rem;
      width: .9rem;
    }
    details.strat-block[open] > summary::before { content: '▾'; }
    details.strat-block > summary h4 { margin: 0; }
    details.strat-block > summary .strat-head { flex: 1 1 12rem; min-width: 0; }
    .strat-def { margin: .2rem 0 0; font-size: .78rem; color: var(--muted); font-weight: 400; line-height: 1.35; }
    details.strat-block .strat-body { padding: 0 .85rem .85rem; }
    .muted { color: var(--muted); font-size: .72rem; }
    .signed-pos { color: var(--pos, #3dd68c); }
    .signed-neg { color: var(--neg, #f07178); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="banner">PAPER ONLY — simulated / probe results · not real money · not financial advice</div>
  <header class="app">
    <h1 id="page-title">Desk Paper Sims</h1>
    <div class="sub" id="page-sub">Review each paper/shadow simulation and its results</div>
    <div class="meta-bar">
      <span class="pill" id="updated-pill">Updated —</span>
      <span class="pill" id="refresh-pill">Auto-refresh 15s</span>
      <span class="pill" id="count-pill">0 sims</span>
    </div>
    <nav class="topnav" aria-label="Dashboard">
      <a href="./" id="nav-home">Overview</a>
      <a href="./tables.html" id="nav-tables">Tables</a>
    </nav>
  </header>
  <main>
    <div id="home-view"></div>
    <div id="tables-view" class="hidden"></div>
    <div id="detail-view" class="hidden"></div>
    <div id="error-view" class="hidden"></div>
  </main>
  <footer>
    Data from <span class="mono">/data/simulations.json</span> + per-sim JSON. Relative paths for Vercel static deploy.
  </footer>
<script>
(function () {
  const REFRESH_MS = 15000;
  const homeEl = document.getElementById('home-view');
  const tablesEl = document.getElementById('tables-view');
  const detailEl = document.getElementById('detail-view');
  const errorEl = document.getElementById('error-view');
  const navHome = document.getElementById('nav-home');
  const navTables = document.getElementById('nav-tables');
  const updatedPill = document.getElementById('updated-pill');
  const countPill = document.getElementById('count-pill');
  const titleEl = document.getElementById('page-title');
  const subEl = document.getElementById('page-sub');

  let indexCache = null;
  let detailCache = {};
  let timer = null;

  function $(sel, root) { return (root || document).querySelector(sel); }

  function fmtNum(n, digs) {
    if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
    const x = Number(n);
    if (Math.abs(x) >= 1000) return x.toLocaleString(undefined, { maximumFractionDigits: digs ?? 2 });
    return x.toLocaleString(undefined, { maximumFractionDigits: digs ?? 3 });
  }
  function fmtPct(n) {
    if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
    return fmtNum(n, 2) + '%';
  }
  function pnlClass(n) {
    if (n === null || n === undefined || Number.isNaN(Number(n))) return '';
    return Number(n) >= 0 ? 'pos' : 'neg';
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }


  function parseTs(t) {
    if (!t) return null;
    const d = Date.parse(String(t).replace(' ', 'T'));
    return Number.isFinite(d) ? d : null;
  }

  function seriesY(points, prefer) {
    // prefer: 'equity' | 'pnl' | 'value'
    return points.map(p => {
      if (prefer === 'value' && p.value != null) return Number(p.value);
      if (prefer === 'pnl' && p.pnl != null) return Number(p.pnl);
      if (p.equity != null) return Number(p.equity);
      if (p.value != null) return Number(p.value);
      if (p.pnl != null) return Number(p.pnl);
      return null;
    });
  }


  function fmtTimePT(t) {
    if (!t) return '';
    const ms = Date.parse(t);
    if (Number.isNaN(ms)) {
      const s = String(t).replace('T', ' ');
      return s.slice(5, 16) || s.slice(0, 16);
    }
    try {
      const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Vancouver',
        month: '2-digit',
        day: '2-digit',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true,
      });
      const parts = fmt.formatToParts(new Date(ms));
      const get = (type) => (parts.find(p => p.type === type) || {}).value || '';
      const mon = get('month');
      const day = get('day');
      const hour = get('hour');
      const minute = get('minute');
      const dayPeriod = get('dayPeriod');
      return mon + '-' + day + ' ' + hour + ':' + minute + (dayPeriod ? ' ' + dayPeriod : '') + ' PT';
    } catch (e) {
      return String(t);
    }
  }

  function renderSvgChart(container, points, opts) {
    opts = opts || {};
    const prefer = opts.prefer || 'equity';
    const yLabel = opts.yLabel || (prefer === 'value' ? 'cum R' : prefer === 'pnl' ? 'PnL' : 'Equity');
    if (!points || points.length < 2) {
      container.innerHTML = '<div class="chart-empty">' + esc(opts.empty || 'No series yet') + '</div>';
      return;
    }
    const ys = seriesY(points, prefer);
    const xs = points.map(p => parseTs(p.t));
    const valid = [];
    for (let i = 0; i < points.length; i++) {
      if (ys[i] == null || Number.isNaN(ys[i])) continue;
      valid.push({ i, x: xs[i] != null ? xs[i] : i, y: ys[i], t: points[i].t, raw: points[i] });
    }
    if (valid.length < 2) {
      container.innerHTML = '<div class="chart-empty">' + esc(opts.empty || 'No series yet') + '</div>';
      return;
    }
    // If times missing, use index
    const useIdx = valid.every(v => v.x == null) || valid.filter(v => v.x != null).length < 2;
    if (useIdx) valid.forEach((v, idx) => { v.x = idx; });

    const W = 640, H = 200;
    const pad = { l: 48, r: 12, t: 14, b: 28 };
    const innerW = W - pad.l - pad.r;
    const innerH = H - pad.t - pad.b;
    let minX = Math.min(...valid.map(v => v.x));
    let maxX = Math.max(...valid.map(v => v.x));
    let minY = Math.min(...valid.map(v => v.y));
    let maxY = Math.max(...valid.map(v => v.y));
    if (minY === maxY) { minY -= 1; maxY += 1; }
    // pad y 6%
    const yPad = (maxY - minY) * 0.06;
    minY -= yPad; maxY += yPad;
    const xSpan = maxX - minX || 1;
    const ySpan = maxY - minY || 1;
    const sx = x => pad.l + ((x - minX) / xSpan) * innerW;
    const sy = y => pad.t + (1 - (y - minY) / ySpan) * innerH;

    const firstY = valid[0].y;
    const lastY = valid[valid.length - 1].y;
    const up = lastY >= firstY;
    const stroke = up ? '#3ecf8e' : '#f07178';
    const fill = up ? 'rgba(62,207,142,.18)' : 'rgba(240,113,120,.18)';

    let dLine = '';
    let dArea = '';
    valid.forEach((v, i) => {
      const X = sx(v.x), Y = sy(v.y);
      dLine += (i ? 'L' : 'M') + X.toFixed(2) + ' ' + Y.toFixed(2) + ' ';
      if (i === 0) dArea = 'M' + X.toFixed(2) + ' ' + sy(minY).toFixed(2) + ' L' + X.toFixed(2) + ' ' + Y.toFixed(2) + ' ';
      else dArea += 'L' + X.toFixed(2) + ' ' + Y.toFixed(2) + ' ';
    });
    const last = valid[valid.length - 1];
    dArea += 'L' + sx(last.x).toFixed(2) + ' ' + sy(minY).toFixed(2) + ' Z';

    // y ticks
    const ticks = 4;
    let yTicks = '';
    for (let i = 0; i <= ticks; i++) {
      const yv = minY + (ySpan * i) / ticks;
      const Y = sy(yv);
      const label = prefer === 'value' ? fmtNum(yv, 2) : fmtNum(yv, yv >= 1000 ? 0 : 2);
      yTicks += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + Y + '" y2="' + Y + '" stroke="#2a3a55" stroke-width="1" opacity=".55"/>';
      yTicks += '<text x="' + (pad.l - 6) + '" y="' + (Y + 3) + '" text-anchor="end" fill="#9aa8c0" font-size="10">' + label + '</text>';
    }
    // x end labels
    function fmtT(t) {
      return fmtTimePT(t);
    }
    const xLabels =
      '<text x="' + pad.l + '" y="' + (H - 8) + '" fill="#9aa8c0" font-size="10">' + esc(fmtT(valid[0].t)) + '</text>' +
      '<text x="' + (W - pad.r) + '" y="' + (H - 8) + '" text-anchor="end" fill="#9aa8c0" font-size="10">' + esc(fmtT(last.t)) + '</text>';

    const delta = lastY - firstY;
    const deltaCls = delta >= 0 ? 'pos' : 'neg';
    const deltaTxt = (delta >= 0 ? '+' : '') + fmtNum(delta, prefer === 'value' ? 3 : 2);

    container.innerHTML =
      '<div class="chart-wrap" style="position:relative">' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(yLabel) + ' chart" preserveAspectRatio="xMidYMid meet">' +
          yTicks +
          '<path d="' + dArea + '" fill="' + fill + '"/>' +
          '<path d="' + dLine + '" fill="none" stroke="' + stroke + '" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>' +
          '<circle class="chart-dot" cx="' + sx(last.x) + '" cy="' + sy(last.y) + '" r="3.5" fill="' + stroke + '"/>' +
          xLabels +
          '<rect class="chart-hit" x="' + pad.l + '" y="' + pad.t + '" width="' + innerW + '" height="' + innerH + '" fill="transparent"/>' +
        '</svg>' +
        '<div class="chart-tip hidden"></div>' +
        '<div class="chart-meta">' +
          '<span>' + esc(yLabel) + ' · ' + valid.length + ' pts' + (opts.note ? ' · ' + esc(opts.note) : '') + '</span>' +
          '<span class="' + deltaCls + '">' + deltaTxt + ' vs start</span>' +
        '</div>' +
      '</div>';

    const wrap = container.querySelector('.chart-wrap');
    const tip = container.querySelector('.chart-tip');
    const svg = container.querySelector('svg');
    const hit = container.querySelector('.chart-hit');
    function nearest(clientX) {
      const rect = svg.getBoundingClientRect();
      const px = ((clientX - rect.left) / rect.width) * W;
      let best = valid[0], bestD = Infinity;
      for (const v of valid) {
        const d = Math.abs(sx(v.x) - px);
        if (d < bestD) { bestD = d; best = v; }
      }
      return best;
    }
    function show(ev) {
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const v = nearest(clientX);
      const val = prefer === 'value' ? fmtNum(v.y, 3) : fmtNum(v.y, 2);
      tip.textContent = (v.t ? fmtT(v.t) + ' · ' : '') + yLabel + ' ' + val;
      tip.classList.remove('hidden');
      const rect = wrap.getBoundingClientRect();
      const svgRect = svg.getBoundingClientRect();
      const left = ((sx(v.x) / W) * svgRect.width);
      tip.style.left = left + 'px';
      tip.style.top = ((sy(v.y) / H) * svgRect.height) + 'px';
      // move dot
      let dot = svg.querySelector('.chart-scan');
      if (!dot) {
        dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('class', 'chart-scan');
        dot.setAttribute('r', '4');
        dot.setAttribute('fill', '#e8eef8');
        dot.setAttribute('stroke', stroke);
        dot.setAttribute('stroke-width', '2');
        svg.appendChild(dot);
      }
      dot.setAttribute('cx', sx(v.x));
      dot.setAttribute('cy', sy(v.y));
    }
    function hide() { tip.classList.add('hidden'); const d = svg.querySelector('.chart-scan'); if (d) d.remove(); }
    hit.addEventListener('mousemove', show);
    hit.addEventListener('touchmove', e => { e.preventDefault(); show(e); }, { passive: false });
    hit.addEventListener('mouseleave', hide);
    hit.addEventListener('touchend', hide);
  }

  function routeSimId() {
    const q = new URLSearchParams(location.search).get('sim');
    if (q) return q;
    const h = (location.hash || '').replace(/^#\/?/, '');
    if (h.startsWith('sim/')) return h.slice(4);
    if (h && !h.includes('/') && h !== 'tables' && h !== 'trades') return h;
    return null;
  }
  function routePage() {
    const q = new URLSearchParams(location.search);
    if (q.get('sim')) return 'sim';
    const page = (q.get('page') || '').toLowerCase();
    if (page === 'tables' || page === 'trades') return 'tables';
    const h = (location.hash || '').replace(/^#\/?/, '').toLowerCase();
    if (h === 'tables' || h === 'trades') return 'tables';
    if (routeSimId()) return 'sim';
    return 'home';
  }
  function setNav(page) {
    navHome.classList.toggle('active', page === 'home');
    navTables.classList.toggle('active', page === 'tables');
  }
  function goHome() {
    history.pushState({}, '', './');
    render();
  }
  function goTables() {
    history.pushState({}, '', '?page=tables');
    render();
  }
  function goSim(id) {
    history.pushState({}, '', '?sim=' + encodeURIComponent(id));
    render();
  }

  async function fetchJson(path) {
    const url = path + (path.includes('?') ? '&' : '?') + '_=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(path + ' → HTTP ' + res.status);
    return res.json();
  }

  async function loadIndex(force) {
    if (!force && indexCache) return indexCache;
    indexCache = await fetchJson('data/simulations.json');
    return indexCache;
  }

  async function loadDetail(id, force) {
    if (!force && detailCache[id]) return detailCache[id];
    const data = await fetchJson('data/sims/' + encodeURIComponent(id) + '.json');
    detailCache[id] = data;
    return data;
  }

  function summaryStatsHtml(sim) {
    const s = sim.summary || {};
    const bits = [];
    if (sim.live) {
      bits.push(stat('Equity', fmtNum(s.equity, 2), pnlClass(s.unrealized_pnl)));
      bits.push(stat('uPnL', fmtNum(s.unrealized_pnl, 2), pnlClass(s.unrealized_pnl)));
      bits.push(stat('Trades', fmtNum(s.total_trades, 0)));
      bits.push(stat('Open', fmtNum(s.open_orders, 0)));
    } else {
      if (s.n != null || s.n_btc_fills != null || s.n_gated != null || s.n_n20_all != null || s.n_liquid != null)
        bits.push(stat('n', fmtNum(s.n ?? s.n_btc_fills ?? s.n_gated ?? s.n_n20_all ?? s.n_liquid, 0)));
      const er = s.expectancy_r_50 ?? s.expectancy_r_50_n20 ?? s.expectancy_r_50_gated ?? s.taker_er_50;
      if (er != null) bits.push(stat('E[R]@50', fmtNum(er, 3), pnlClass(er)));
      if (s.return_pct_50 != null) bits.push(stat('Ret%@50', fmtPct(s.return_pct_50), pnlClass(s.return_pct_50)));
      if (s.maker_improve_er_80 != null) bits.push(stat('Maker@80', fmtNum(s.maker_improve_er_80, 3), pnlClass(s.maker_improve_er_80)));
      if (s.ranks_cached != null) bits.push(stat('Ranks', fmtNum(s.ranks_cached, 0)));
      if (s.fills) bits.push(stat('Fills', String(s.fills)));
      if (s.oos_n != null) bits.push(stat('OOS n', fmtNum(s.oos_n, 0)));
    }
    return '<div class="stats">' + bits.join('') + '</div>';
  }
  function stat(k, v, cls) {
    return '<div class="stat"><span class="k">' + esc(k) + '</span><span class="v ' + (cls||'') + '">' + esc(v) + '</span></div>';
  }

  function strategyDef(st) {
    const fromData = (st && st.definition) ? String(st.definition).trim() : "";
    if (fromData) return fromData;
    const key = (st && st.strategy) ? String(st.strategy) : "unattributed";
    return STRATEGY_DEFS[key] || "";
  }

  function strategyTablesHtml(tables) {
    if (!tables || !tables.length) return '';
    let html = '<div class="detail-section strat-section"><h3>Strategies</h3>';
    html += '<p class="strat-note">FIFO vs shared book. Completed = closed lot (sell vs oldest buy), attributed to the exit strategy. Open = leftover lots on the current book with mark-to-market. MTM is not closed P&amp;L. No fabricated win%.</p>';
    for (const st of tables) {
      const m = st.metrics || {};
      const nDone = m.completed || 0;
      const nOpen = m.open || ((st.open || []).length) || 0;
      const sumPnl = m.sum_pnl;
      const sumPnlTxt = sumPnl == null ? '—' :
        ((sumPnl >= 0 ? '+' : '') + fmtNum(sumPnl, 2));
      const openMtm = m.open_unrealized_pnl;
      const openMtmTxt = openMtm == null ? '—' :
        ((openMtm >= 0 ? '+' : '') + fmtNum(openMtm, 2));
      const wl = (m.wins != null || m.losses != null)
        ? ('<span class="pill">' + esc(fmtNum(m.wins, 0)) + 'W / ' + esc(fmtNum(m.losses, 0)) + 'L</span>')
        : '';
      const def = strategyDef(st);
      const hasRows = nDone > 0 || nOpen > 0;
      html += '<details class="strat-block"' + (hasRows ? ' open' : '') + '>' +
        '<summary>' +
          '<div class="strat-head">' +
            '<h4>' + esc(st.strategy || 'unattributed') + '</h4>' +
            (def ? '<p class="strat-def">' + esc(def) + '</p>' : '') +
          '</div>' +
          '<div class="strat-pills">' +
            '<span class="pill">' + esc(fmtNum(nOpen, 0)) + ' open</span>' +
            '<span class="pill">' + esc(fmtNum(nDone, 0)) + ' completed</span>' +
            wl +
            '<span class="pill ' + pnlClass(openMtm) + '">open MTM ' + esc(openMtmTxt) + '</span>' +
            '<span class="pill ' + pnlClass(sumPnl) + '">closed P&amp;L ' + esc(sumPnlTxt) + '</span>' +
          '</div>' +
        '</summary>' +
        '<div class="strat-body">' +
        '<div class="strat-pills">' +
          '<span class="pill mono">' + esc(st.strategy_id || '') + '</span>' +
          '<span class="pill">fees ' + esc(fmtNum(m.fees, 2)) + '</span>' +
          '<span class="pill">' + esc(fmtNum(m.fills, 0)) + ' fills</span>' +
          '<span class="pill">' + esc(fmtNum(m.buys, 0)) + ' buy / ' + esc(fmtNum(m.sells, 0)) + ' sell</span>' +
        '</div>';

      const openRows = st.open || [];
      if (openRows.length) {
        html += '<h5 class="strat-sub">Open lots (current book)</h5>';
        html += '<div class="scroll-x"><table><thead><tr>' +
          '<th>Opened (PT)</th><th>Pair</th><th>Amount</th><th>Entry</th><th>Mark</th><th>MTM</th><th>MTM %</th><th>Fees</th>' +
          '</tr></thead><tbody>';
        for (const t of openRows) {
          const openLabel = t.entry_pt || fmtTimePT(t.entry_time) || '';
          const mtm = t.unrealized_pnl;
          const mtmTxt = mtm == null ? '—' : ((mtm >= 0 ? '+' : '') + fmtNum(mtm, 2));
          const pctTxt = t.unrealized_pnl_pct == null ? '—' : ((t.unrealized_pnl_pct >= 0 ? '+' : '') + fmtNum(t.unrealized_pnl_pct, 2) + '%');
          html += '<tr>' +
            '<td class="mono">' + esc(openLabel) + '</td>' +
            '<td>' + esc(t.pair || '') + '</td>' +
            '<td>' + esc(fmtNum(t.amount, 6)) + '</td>' +
            '<td>' + esc(fmtNum(t.entry, 2)) + '</td>' +
            '<td>' + esc(fmtNum(t.mark, 2)) + '</td>' +
            '<td class="' + pnlClass(mtm) + '">' + esc(mtmTxt) + '</td>' +
            '<td class="' + pnlClass(t.unrealized_pnl_pct) + '">' + esc(pctTxt) + '</td>' +
            '<td>' + esc(fmtNum(t.fees, 4)) + '</td>' +

      const rows = st.completed || [];

        html += '<div class="scroll-x"><table><thead><tr>' +
          '<th>Exit (PT)</th><th>Pair</th><th>Amount</th><th>Entry</th><th>Exit $</th><th>P&amp;L</th><th>P&amp;L %</th><th>Fees</th>' +

        for (const t of rows) {

          const pctTxt = t.pnl_pct == null ? '—' : ((t.pnl_pct >= 0 ? '+' : '') + fmtNum(t.pnl_pct, 2) + '%');

          if (t.entry_strategy && t.exit_strategy && t.entry_strategy !== t.exit_strategy) {
            pairCell += '<div class="muted">entry: ' + esc(t.entry_strategy) + '</div>';

          html += '<tr>' +
            '<td class="mono">' + esc(exitLabel) + '</td>' +

            '<td>' + esc(fmtNum(t.fees, 4)) + '</td>' +

  function renderDetail(d) {
    titleEl.textContent = d.title || d.id;
    subEl.textContent = (d.strategy_id || '') + (d.live ? ' · live workspace' : ' · explore probe');
    setNav('sim');
    updatedPill.textContent = 'Updated ' + (d.updated_at_pt || d.updated_at || '—');
    countPill.textContent = d.family || d.id;

    const m = d.metrics || {};
    let metricsBlock = '';
    if (d.live) {
      metricsBlock =
        '<div class="stats">' +
          stat('Equity', fmtNum(m.equity, 2), pnlClass(m.unrealized_pnl)) +
          stat('uPnL', fmtNum(m.unrealized_pnl, 2) + ' (' + fmtPct(m.unrealized_pnl_pct) + ')', pnlClass(m.unrealized_pnl)) +
          stat('Start', fmtNum(m.starting_balance, 2)) +
          stat('Trades', fmtNum(m.total_trades, 0)) +
          stat('Open orders', fmtNum(m.open_orders, 0)) +
          stat('Fee rate', fmtNum((m.fee_rate || 0) * 100, 2) + '%') +
        '</div>';
      if (d.balances) {
        metricsBlock += '<div class="stats" style="margin-top:.6rem">' +
          Object.entries(d.balances).map(([k,v]) => stat(k, fmtNum(v, 6))).join('') +
        '</div>';
      }
      if (d.marks && Object.keys(d.marks).length) {
        metricsBlock += '<div class="stats" style="margin-top:.6rem">' +
          Object.entries(d.marks).map(([k,v]) => stat('Mark ' + k, fmtNum(v, 2))).join('') +
        '</div>';
      }
    } else {
      const primary = m.primary_at_50bps || {};
      metricsBlock =
        '<div class="stats">' +
          (primary.n != null ? stat('n @50', fmtNum(primary.n, 0)) : '') +
          (primary.expectancy_r != null ? stat('E[R]@50', fmtNum(primary.expectancy_r, 3), pnlClass(primary.expectancy_r)) : '') +
          (primary.return_pct != null ? stat('Ret%@50', fmtPct(primary.return_pct), pnlClass(primary.return_pct)) : '') +
          (primary.max_dd_pct != null ? stat('maxDD%', fmtNum(primary.max_dd_pct, 2)) : '') +
          (m.n_liquid != null ? stat('Liquid', fmtNum(m.n_liquid, 0)) : '') +
          (m.n != null && !primary.n ? stat('n', fmtNum(m.n, 0)) : '') +
        '</div>';
      if (d.scoreboard_headline) {
        metricsBlock += '<p class="headline" style="margin-top:.75rem">' + esc(d.scoreboard_headline) + '</p>';
      }
    }

    let feeBlock = '';
    const stress = d.fee_stress || m.fee_stress || m.stress_gated || m.taker_8_50_100;
    if (stress) {
      feeBlock = '<div class="detail-section"><h3>Fee stress</h3>' + feeStressTable(stress) + '</div>';
      if (m.short_window_stress) {
        feeBlock += '<div class="detail-section"><h3>Short-window fee stress</h3>' + feeStressTable(m.short_window_stress) + '</div>';
      }
      if (m.stress_ungated) {
        feeBlock += '<div class="detail-section"><h3>Ungated control (REJECT)</h3>' + feeStressTable(m.stress_ungated) + '</div>';
      }
      if (m.maker_improve_80) {
        feeBlock += '<div class="detail-section"><h3>Maker improve @80</h3>' + feeStressTable(m.maker_improve_80) + '</div>';
      }
      if (m.maker_adverse_80) {
        feeBlock += '<div class="detail-section"><h3>Maker + adverse @80</h3>' + feeStressTable(m.maker_adverse_80) + '</div>';
      }
    }

    // F02 nested N10/N20
    let f02Block = '';
    if (m.results && m.results.N10) {
      f02Block += '<div class="detail-section"><h3>F02 N=10 all</h3>' + feeStressTable(m.results.N10.stress_all) + '</div>';
      f02Block += '<div class="detail-section"><h3>F02 N=20 all</h3>' + feeStressTable(m.results.N20.stress_all) + '</div>';
      f02Block += '<div class="detail-section"><h3>F02 N=20 OOS</h3>' + feeStressTable(m.results.N20.stress_oos) + '</div>';
    }

    const learn = (d.learnings || []).map(x => '<li>' + esc(x) + '</li>').join('');
    const learnBlock = '<div class="detail-section"><h3>Learnings / next</h3>' +
      (learn ? '<ul class="learn">' + learn + '</ul>' : '<p class="empty">None</p>') + '</div>';

    const tradeNote = d.trades_total && d.trades && d.trades_total > d.trades.length
      ? '<p class="empty">Showing ' + d.trades.length + ' of ' + d.trades_total + ' rows (most recent).</p>'
      : '';
    const stratBlock = d.live
      ? '<p class="strat-note"><a href="./tables.html" id="detail-tables-link">Strategy tables →</a> completed lots live on their own page.</p>'
      : '';
    const tradesBlock = stratBlock +
      '<div class="detail-section"><h3>' + (d.live ? 'Paper trades (raw fills)' : 'Trades / ranks sample') + '</h3>' +
      tradeNote + tradesTable(d.trades, !!d.live) + '</div>';

    let ordersBlock = '';
    if (d.live && d.open_orders && d.open_orders.length) {
      ordersBlock = '<div class="detail-section"><h3>Open orders</h3>' + tradesTable(d.open_orders.map(o => ({
        id: o.id, side: o.side, pair: o.pair, type: o.type, price: o.price, volume: o.volume, created_at: o.created_at
      })), false) + '</div>';
    }

    const ranksBlock = ranksTable(d.ranks || m.ranks);

    let gapsBlock = '';
    if (d.parse_gaps && d.parse_gaps.length) {
      gapsBlock = '<div class="detail-section"><h3>Parse gaps</h3><ul class="learn">' +
        d.parse_gaps.map(g => '<li class="mono">' + esc(g) + '</li>').join('') + '</ul></div>';
    }

    let mdBlock = '';
    if (d.md_excerpt) {
      mdBlock = '<div class="detail-section"><h3>Artifact excerpt</h3><pre class="raw">' + esc(d.md_excerpt) + '</pre></div>';
    }
    if (d.breakers_excerpt) {
      mdBlock += '<div class="detail-section"><h3>Breakers excerpt</h3><pre class="raw">' + esc(d.breakers_excerpt) + '</pre></div>';
    }
    if (d.quant_note_excerpt) {
      mdBlock += '<div class="detail-section"><h3>Quant note</h3><pre class="raw">' + esc(d.quant_note_excerpt) + '</pre></div>';
    }

    const chartSection =
      '<div class="detail-section"><h3>Performance</h3><div id="detail-perf-chart"></div></div>';

    detailEl.innerHTML =
      '<button type="button" class="back" id="back-btn">← All simulations</button>' +
      '<div class="detail-section"><h3>Results</h3>' +
        '<div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem">' +
          (d.live ? '<span class="pill live">LIVE PAPER</span>' : '') +
          '<span class="pill mode">' + esc(d.mode || '') + '</span>' +
          '<span class="pill">' + esc(d.family || '') + '</span>' +
          (d.workspace ? '<span class="pill mono">' + esc(d.workspace) + '</span>' : '') +
        '</div>' +
        metricsBlock +
        '<p class="empty" style="margin-top:.75rem">' + esc(d.disclaimer || '') + '</p>' +
      '</div>' +
      chartSection +
      feeBlock + f02Block + ordersBlock + ranksBlock + tradesBlock + learnBlock + gapsBlock + mdBlock;

    $('#back-btn', detailEl).addEventListener('click', goHome);
    const dt = document.getElementById('detail-tables-link');
    if (dt) dt.addEventListener('click', e => { e.preventDefault(); goTables(); });

    const perfEl = document.getElementById('detail-perf-chart');
    if (perfEl) {
      if (d.equity_series && d.equity_series.length >= 2) {
        renderSvgChart(perfEl, d.equity_series, {
          prefer: 'equity',
          yLabel: d.live ? 'Equity $' : 'Equity @50bps',
          note: d.series_note || (d.live ? 'fills + marks · PT' : 'fee stress replay · PT'),
          empty: d.series_note || 'no series yet',
        });
      } else if (d.metric_series && d.metric_series.length >= 2) {
        renderSvgChart(perfEl, d.metric_series, {
          prefer: 'value',
          yLabel: 'Cum R @50bps',
          note: d.series_note || 'cumulative R',
          empty: d.series_note || 'no series yet',
        });
      } else {
        renderSvgChart(perfEl, [], {
          empty: d.series_note || 'no series yet',
        });
      }
    }
  }

  async function render(opts) {
    const force = !!(opts && opts.force);
    const page = routePage();
    const simId = routeSimId();
    errorEl.classList.add('hidden');
    try {
      const idx = await loadIndex(force);
      if (page === 'sim' && simId) {
        homeEl.classList.add('hidden');
        tablesEl.classList.add('hidden');
        detailEl.classList.remove('hidden');
        const d = await loadDetail(simId, force);
        renderDetail(d);
      } else if (page === 'tables') {
        detailEl.classList.add('hidden');
        homeEl.classList.add('hidden');
        tablesEl.classList.remove('hidden');
        await renderTables();
      } else {
        detailEl.classList.add('hidden');
        tablesEl.classList.add('hidden');
        homeEl.classList.remove('hidden');
        detailCache = {}; // allow refresh of details next open
        await renderHome(idx);
      }
    } catch (e) {
      homeEl.classList.add('hidden');
      tablesEl.classList.add('hidden');
      detailEl.classList.add('hidden');
      errorEl.classList.remove('hidden');
      errorEl.innerHTML = '<div class="err"><strong>Load failed</strong><br/>' + esc(e.message || e) +
        '<br/><button type="button" class="back" id="retry-btn" style="margin-top:.75rem">Retry</button></div>';
      const rb = document.getElementById('retry-btn');
      if (rb) rb.addEventListener('click', () => render({ force: true }));
    }
  }

  window.addEventListener('popstate', () => render());
  window.addEventListener('hashchange', () => render());

  function schedule() {
    if (timer) clearInterval(timer);
    timer = setInterval(() => render({ force: true }), REFRESH_MS);
  }

  navHome.addEventListener('click', e => { e.preventDefault(); goHome(); });
  navTables.addEventListener('click', e => { e.preventDefault(); goTables(); });

  render({ force: true });
  schedule();
})();
</script>
</body>
</html>
